# Serveur Premium d'EquilibreCuisine — voir DEPLOIEMENT.md
name = "equilibrecuisine-premium"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Compte Cloudflare (identifiant public, pas un secret). Adresse : https://equilibrecuisine-premium.mamar75014.workers.dev
account_id = "e740f63a1ff139f51c4eec4c2dcfae6f"

# Aucun appel n'atteint ce serveur depuis la version gratuite de l'application.
[vars]
PACKAGE_NAME = "com.equilibrecuisine.app"
# Abonnement Google Play (Play Console > Monétiser > Abonnements) et ses deux formules de base.
PRODUCT_ID = "premium"
BASE_PLAN_MONTHLY = "mensuel"
BASE_PLAN_YEARLY = "annuel"
# Modèle Claude : Haiku = coût minimal. claude-sonnet-5-5 pour des recettes plus fines (≈ 20× plus cher).
CLAUDE_MODEL = "claude-haiku-5-5"
# Quotas quotidiens par abonné : protègent la marge (3,99 €/mois) contre un usage abusif.
QUOTA_RECIPE = "15"
QUOTA_IMPORT = "20"
QUOTA_PHOTO = "8"
QUOTA_SUGGEST = "8"
QUOTA_SYNC = "60"
QUOTA_BACKUP = "12"
MAX_BACKUPS = "10"
# Code d'accès Premium des examinateurs Google Play : seule son empreinte SHA-256 figure ici.
# Vider la valeur désactive immédiatement tous les accès par code.
ACCESS_CODE_SHA256 = "8b1cabec2738199866cbd5acc6610b96a80f8b2daa64bc29192f35d9da0ced1b"

# Base D1 : `npx wrangler d1 create equilibrecuisine`, puis coller l'identifiant affiché.
[[d1_databases]]
binding = "DB"
database_name = "equilibrecuisine"
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GOOGLE_SERVICE_ACCOUNT   (contenu du fichier JSON du compte de service)
#   npx wrangler secret put RTDN_TOKEN               (chaîne aléatoire, aussi mise dans l'URL Pub/Sub)
